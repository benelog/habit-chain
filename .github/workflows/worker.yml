name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 배포를 일부러 멈추고 싶으면 저장소 변수 DEPLOY_WORKER를 false로 둔다.
    if: ${{ vars.DEPLOY_WORKER != 'false' }}
    steps:
      # 시크릿 확인이 맨 앞이다. 없으면 여기서 끝내야 설치와 테스트를 헛돌리지 않는다.
      #
      # 예전에는 시크릿이 없으면 배포 단계를 조용히 건너뛰고 초록불로 끝났다.
      # 그래서 커밋은 올라갔는데 사이트는 옛 코드를 계속 서빙하는 동안,
      # Actions 화면만 보면 배포된 줄 알았다. 이제는 실패로 멈춘다.
      - name: Cloudflare 시크릿 확인
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "$TOKEN" ]; then
            missing="$missing CLOUDFLARE_API_TOKEN"
          fi
          if [ -z "$ACCOUNT" ]; then
            missing="$missing CLOUDFLARE_ACCOUNT_ID"
          fi
          if [ -n "$missing" ]; then
            echo "::error::배포에 필요한 시크릿이 없습니다:$missing — 저장소 Settings → Secrets에 넣어 주세요."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 의존성 설치
        working-directory: worker
        run: npm ci

      - name: 타입 검사와 테스트
        working-directory: worker
        run: |
          npm run check
          npm test

      - name: 서비스 워커 캐시 버전 갱신
        run: sed -i "s/const BUILD_ID = \"dev\";/const BUILD_ID = \"${GITHUB_SHA::12}\";/" web/sw.js

      # 빌드는 sw.js를 고친 뒤여야 한다. web/ 을 dist/ 로 복사하기 때문이다.
      - name: 빌드
        working-directory: worker
        run: npm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4.125.0'
          packageManager: npm
          command: pages deploy --project-name habit-chain --branch main --commit-dirty=true
