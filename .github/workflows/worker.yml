name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Set the repo variable DEPLOY_WORKER to false to stop deploying.
    if: ${{ vars.DEPLOY_WORKER != 'false' }}
    steps:
      # Secrets are checked first, so a missing one stops the run before the
      # install and tests are spent.
      #
      # This step used to skip the deploy silently and finish green, so pushed
      # commits never shipped while Actions looked healthy. Now it fails.
      - name: Cloudflare 시크릿 확인
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "$TOKEN" ]; then
            missing="$missing CLOUDFLARE_API_TOKEN"
          fi
          if [ -z "$ACCOUNT" ]; then
            missing="$missing CLOUDFLARE_ACCOUNT_ID"
          fi
          if [ -n "$missing" ]; then
            echo "::error::배포에 필요한 시크릿이 없습니다:$missing — 저장소 Settings → Secrets에 넣어 주세요."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 의존성 설치
        working-directory: worker
        run: npm ci

      - name: 타입 검사와 테스트
        working-directory: worker
        run: |
          npm run check
          npm test

      - name: 서비스 워커 캐시 버전 갱신
        run: sed -i "s/const BUILD_ID = \"dev\";/const BUILD_ID = \"${GITHUB_SHA::12}\";/" web/sw.js

      # Build after editing sw.js: the build copies web/ into dist/.
      - name: 빌드
        working-directory: worker
        run: npm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4.125.0'
          packageManager: npm
          command: pages deploy --project-name habit-chain --branch main --commit-dirty=true
