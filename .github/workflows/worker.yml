name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Cloudflare 시크릿이 아직 없으면 조용히 건너뛴다.
    if: ${{ vars.DEPLOY_WORKER != 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 의존성 설치
        working-directory: worker
        run: npm ci

      - name: 타입 검사와 테스트
        working-directory: worker
        run: |
          npm run check
          npm test

      - name: 서비스 워커 캐시 버전 갱신
        run: sed -i "s/const BUILD_ID = \"dev\";/const BUILD_ID = \"${GITHUB_SHA::12}\";/" web/sw.js

      # 빌드는 sw.js를 고친 뒤여야 한다. web/ 을 dist/ 로 복사하기 때문이다.
      - name: 빌드
        working-directory: worker
        run: npm run build

      # DOLTHUB_TOKEN·WRITE_KEY는 `wrangler secret put` 으로 따로 넣는다.
      # 배포는 그 값을 건드리지 않는다.
      - name: Cloudflare 시크릿 확인
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN이 없어 배포를 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: cloudflare/wrangler-action@v3
        if: steps.check.outputs.ready == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4.125.0'
          packageManager: npm
          command: pages deploy --project-name habit-chain --branch main --commit-dirty=true
